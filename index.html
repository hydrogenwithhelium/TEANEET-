<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TEANEET</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #f7f7f7; color: #111;
    }
    main { width: min(92vw, 420px); text-align: center; }
    .card {
      background: #fff; border: 1px solid #e9e9e9; border-radius: 20px;
      padding: 36px 24px; box-shadow: 0 12px 40px rgba(0,0,0,.06);
    }
    h1 { margin: 0 0 10px; font-size: 34px; letter-spacing: -.04em; }
    p { color: #666; margin: 0 0 24px; line-height: 1.5; }
    .price { font-size: 28px; font-weight: 700; margin: 14px 0 22px; }
    button {
      width: 100%; border: 0; border-radius: 12px; padding: 14px 18px;
      font-size: 16px; font-weight: 700; cursor: pointer; background: #111; color: #fff;
    }
    button.secondary { background: #eee; color: #111; margin-top: 10px; }
    .hidden { display: none; }
    .muted { font-size: 13px; color: #888; margin-top: 16px; }
  </style>
</head>
<body>
<main>
  <section id="home" class="card">
    <h1>TEANEET</h1>
    <p>Simple and secure payment.</p>
    <div class="price">₹49</div>
    <button id="payBtn">Pay Now</button>
    <div class="muted">You will be taken to your UPI app.</div>
  </section>

  <section id="confirm" class="card hidden">
    <h1>Payment check</h1>
    <p>Did you complete the ₹49 payment?</p>
    <button id="yesBtn">Yes</button>
    <button id="noBtn" class="secondary">No</button>
  </section>
</main>

<script>
  const UPI_ID = "niiilavs@okhdfcbank";
  const AMOUNT = "49";
  const FORM_URL =
    "https://app.youform.com/forms/lsdfcskk";

  const home = document.getElementById("home");
  const confirmBox = document.getElementById("confirm");
  const payBtn = document.getElementById("payBtn");
  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");

  let paymentStarted = false;
  let leftForUpi = false;
  let confirmTimer = null;

  function showConfirm() {
    if (!paymentStarted) return;
    home.classList.add("hidden");
    confirmBox.classList.remove("hidden");
  }

  function returnToHome() {
    paymentStarted = false;
    leftForUpi = false;
    confirmBox.classList.add("hidden");
    home.classList.remove("hidden");
  }

  payBtn.addEventListener("click", () => {
    paymentStarted = true;
    leftForUpi = true;

    const upiUrl =
      `upi://pay?pa=${encodeURIComponent(UPI_ID)}` +
      `&pn=${encodeURIComponent("teaneet")}` +
      `&am=${encodeURIComponent(AMOUNT)}` +
      `&cu=INR`;

    // Give the browser a moment to register the navigation away.
    window.location.href = upiUrl;

    // Fallback for browsers that do not fire visibility/pageshow after the UPI app returns.
    clearTimeout(confirmTimer);
    confirmTimer = setTimeout(() => {
      if (document.visibilityState === "visible" && leftForUpi) showConfirm();
    }, 1800);
  });

  // When the user returns from a UPI app, browsers commonly fire one of these.
  document.addEventListener("visibilitychange", () => {
    if (paymentStarted && leftForUpi && document.visibilityState === "visible") {
      setTimeout(showConfirm, 300);
    }
  });

  window.addEventListener("pageshow", () => {
    if (paymentStarted && leftForUpi) setTimeout(showConfirm, 300);
  });

  yesBtn.addEventListener("click", () => {
    window.location.href = FORM_URL;
  });

  noBtn.addEventListener("click", returnToHome);
</script>
</body>
</html>
